<!doctype html>
<html lang="{{ lang|default('es', true) }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}{{ page_title|default('Aplicación Racafé', true) }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_prefix|default('/static', true) }}/css/racafe-web.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="rfw-header">
    <a class="rfw-brand" href="{{ home_url|default('/', true) }}" aria-label="Racafé, inicio">
      <img class="rfw-brand-logo" src="{{ static_prefix|default('/static', true) }}/img/logo.png" alt="Racafé">
      <span class="rfw-brand-area">{{ application_name|default('Aplicación corporativa', true) }}</span>
    </a>
    <div class="rfw-header-actions">{% block header_actions %}{% endblock %}</div>
  </header>

  <main class="rfw-shell" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="rfw-footer">
    <span class="rfw-footer-brand">
      <img src="{{ static_prefix|default('/static', true) }}/img/logo2.png" alt="">
      Racafé &amp; Cía. S.C.A.
    </span>
    <span>{% block footer_text %}{{ footer_text|default('', true) }}{% endblock %}</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
